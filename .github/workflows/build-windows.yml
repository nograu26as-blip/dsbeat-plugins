name: Build Windows (VST3 + Standalone)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git juce

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja + MSVC)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          # VST3
          Get-ChildItem -Recurse -Path build -Filter "DSBeatMaster.vst3" -Directory | ForEach-Object { Copy-Item -Recurse $_.FullName "dist/DSBeatMaster.vst3" }
          Get-ChildItem -Recurse -Path build -Filter "DSBeatGainStage.vst3" -Directory | ForEach-Object { Copy-Item -Recurse $_.FullName "dist/DSBeatGainStage.vst3" }
          # Standalone
          Get-ChildItem -Recurse -Path build -Filter "DSBeatMaster.exe" | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "dist/DSBeatMaster.exe" }
          Get-ChildItem -Recurse -Path build -Filter "DSBeatGainStage.exe" | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "dist/DSBeatGainStage.exe" }
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSBeat-Plugins-Windows64
          path: dist/
